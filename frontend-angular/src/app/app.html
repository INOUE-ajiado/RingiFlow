@if (user(); as currentUser) {
  <header class="app-header">
    <div class="inner">
      <a routerLink="/ringi" class="brand">
        <span class="brand-mark" aria-hidden="true"><app-icon name="brand" [size]="18" /></span>
        <span class="brand-name">RingiFlow</span>
      </a>
      <div class="user">
        <span class="name">{{ currentUser.name }}</span>
        <span class="role">{{ roleLabel() }}</span>
      </div>
    </div>
  </header>
}

<main [class.with-header]="!!user()">
  @if (!ready()) {
    <div class="booting">
      <app-icon name="spinner" [size]="30" />
      <p>読み込んでいます...</p>
    </div>
  } @else if (error()) {
    <div class="boot-error card">
      <h1>起動できませんでした</h1>
      <p>{{ error() }}</p>
      <button type="button" class="btn btn-primary" (click)="reload()">再読み込み</button>
    </div>
  } @else {
    <router-outlet />
  }
</main>
