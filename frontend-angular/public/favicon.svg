<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    RingiFlow ファビコン。
    ヘッダーのブランドマーク（app-icon の brand）と同じ意匠。
    小さく表示されるため、線幅は本体の 1.75 より太い 3 として潰れを防いでいる。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df0" />
      <stop offset="1" stop-color="#1743aa" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)" />

  <g
    transform="translate(4 4) scale(1)"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M8 20V4h5.5a4 4 0 0 1 0 8H8" />
    <path d="M12 12l5 8" />
  </g>
</svg>
